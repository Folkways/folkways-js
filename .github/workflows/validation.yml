name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK and examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Check public source boundary
        run: |
          node --test scripts/check-public-boundary.test.mjs
          node scripts/check-public-boundary.mjs source --strict
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Type-check README examples
        run: node scripts/check-readme.mjs
      - name: Inspect and smoke-test the release package
        run: |
          package_dir="$RUNNER_TEMP/sdk-package"
          pnpm --filter @folkwaysio/realtime pack:release "$package_dir"
          tarball=$(find "$package_dir" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          mkdir "$package_dir/unpacked"
          tar -xzf "$tarball" -C "$package_dir/unpacked"
          node scripts/check-public-boundary.mjs artifact "$package_dir/unpacked/package"
          mkdir "$package_dir/consumer"
          cd "$package_dir/consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$tarball"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const pkg = require('@folkwaysio/realtime/package.json');
          for (const [name, target] of Object.entries(pkg.exports)) {
            if (typeof target !== 'object' || !target.import || !target.require) continue;
            const specifier = name === '.' ? pkg.name : pkg.name + name.slice(1);
            assert.ok(Object.keys(await import(specifier)).length, specifier);
            assert.ok(Object.keys(require(specifier)).length, specifier);
          }
          assert.ok(require.resolve('@folkwaysio/realtime/iife'));
          NODE

  protocol:
    name: Protocol bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Build the pinned FlatBuffers compiler
        run: |
          source="$RUNNER_TEMP/flatbuffers-source"
          build="$RUNNER_TEMP/flatbuffers-build"
          git init "$source"
          git -C "$source" fetch --depth=1 https://github.com/google/flatbuffers.git 595bf0007ab1929570c7671f091313c8fc20644e
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 595bf0007ab1929570c7671f091313c8fc20644e
          cmake -S "$source" -B "$build" -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF -DFLATBUFFERS_BUILD_FLATLIB=OFF -DFLATBUFFERS_BUILD_FLATHASH=OFF
          cmake --build "$build" --target flatc --parallel 2
          "$build/flatc" --version
      - name: Verify generated bindings
        run: |
          FLATC="$RUNNER_TEMP/flatbuffers-build/flatc" pnpm --filter @folkwaysio/realtime proto
          if [[ -n "$(git status --porcelain --untracked-files=all -- packages/realtime/src/transport/wire/generated)" ]]; then
            echo "::error::Generated protocol bindings differ. Regenerate with the pinned compiler and commit the result."
            exit 1
          fi
