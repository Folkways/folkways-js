name: Bug report
description: Something in the SDK doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Issues are public: **never paste tokens, private keys, secrets or your users' personal data.**
        Security problems go to support@folkways.io instead (see the [security policy](https://github.com/Folkways/folkways-js/blob/main/docs/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest piece of code that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: error
    attributes:
      label: Error
      description: The error's codeName and message, if there is one.
      placeholder: "Forbidden: not allowed (topic chat/lobby)"
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The value of Folkways.version.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Browser, Node.js, React Native, Deno or Bun, with its version, and your operating system.
      placeholder: "Chrome 141 on macOS 26"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: From client.session?.transport.
      options:
        - websocket
        - http
        - not connected
        - don't know
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Turn them on with `logger: consoleLogger('debug')`. Check for personal data before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and the documentation at docs.folkways.io.
          required: true
        - label: This report contains no tokens, keys, secrets or personal data.
          required: true
