name: Feature request
description: Suggest an improvement to the SDK.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you imagine it working. Code sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you've considered or tried.
